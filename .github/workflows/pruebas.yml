name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: skills/analitica-marketing-mentinno-coach
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: skills/analitica-marketing-mentinno-coach/requirements.txt
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Pruebas de cada módulo
        run: |
          python tests/check_classify.py
          python tests/check_ab.py
          python tests/check_uplift_did.py
          python tests/check_clv.py
          python tests/check_attribution.py
      - name: Compuerta de la mezcla de medios
        run: python tests/bench_mmm.py
